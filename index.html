<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothingness</title>

    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: default; /* cursor visible now */
        }

        /* The glowing orb */
        .orb {
            position: absolute;
            width: 50px; /* increased size */
            height: 50px;
            top: 50%; /* start center */
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,255,255,1) 40%, rgba(255,255,255,0) 80%);
            border-radius: 50%;
            filter: blur(3px);
            opacity: 0.9;
            transition: transform 3s ease, opacity 1s ease;
            cursor: pointer;
        }

        /* Fade-out effect */
        .fadeout {
            animation: expand 1.5s ease forwards;
        }

        @keyframes expand {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(60); opacity: 0; }
        }
    </style>
</head>

<body>

    <div class="orb" id="orb"></div>

    <script>
        const orb = document.getElementById("orb");

        // Function for random drift within screen bounds
        function driftOrb() {
            const x = Math.random() * (window.innerWidth - 50); // keep inside viewport
            const y = Math.random() * (window.innerHeight - 50);

            orb.style.transition = "transform 6s ease-in-out";
            orb.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Start drifting slowly and continuously
        setInterval(driftOrb, 3000);

        // Initial drift after page load
        driftOrb();

        // Click → orb expands → redirects to creation.html
        orb.addEventListener("click", () => {
            orb.classList.add("fadeout");

            setTimeout(() => {
                window.location.href = "creation.html";
            }, 1500);
        });
    </script>

</body>
</html>
