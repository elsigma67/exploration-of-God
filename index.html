<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothingness</title>

    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: default;
        }

        /* The glowing orb */
        .orb {
            position: absolute;
            width: 50px;
            height: 50px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,255,255,1) 40%, rgba(255,255,255,0) 80%);
            border-radius: 50%;
            filter: blur(3px);
            opacity: 0.9;
            cursor: pointer;
        }

        /* Fade-out effect on click */
        .fadeout {
            animation: expand 1.5s ease forwards;
        }

        @keyframes expand {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(60); opacity: 0; }
        }
    </style>
</head>

<body>

    <div class="orb" id="orb"></div>

    <script>
        const orb = document.getElementById("orb");

        // Floating effect around a fixed point
        let angle = 0;
        const radius = 30; // orbit radius in pixels

        function floatOrb() {
            angle += 0.02; // speed
            const x = Math.sin(angle) * radius;
            const y = Math.cos(angle) * radius;
            orb.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            requestAnimationFrame(floatOrb);
        }

        floatOrb();

        // Click → orb expands → redirects to creation.html
        orb.addEventListener("click", () => {
            orb.classList.add("fadeout");
            setTimeout(() => {
                window.location.href = "creation.html";
            }, 1500);
        });
    </script>

</body>
</html>
