<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: 'Cinzel', serif;
            overflow: hidden;
        }

        .day {
            position: absolute;
            font-size: 2rem;
            opacity: 0;
            cursor: pointer;
            transition: opacity 0.5s ease, text-shadow 0.3s ease;
        }

        .day.visible {
            opacity: 1;
        }

        .day:hover {
            text-shadow: 0 0 15px white, 0 0 30px white;
        }

        .skip-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e90ff;
            color: black;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            transition: transform 0.3s ease;
        }

        .skip-btn:hover {
            transform: scale(1.1);
        }

        #message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            font-size: 3rem;
            font-family: 'Cinzel', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease;
        }
    </style>
</head>

<body>
    <!-- Days scattered -->
    <div class="day" id="day1" style="top: 15%; left: 10%;">Day 1 — Illumination</div>
    <div class="day" id="day2" style="top: 40%; left: 65%;">Day 2 — Heaven</div>
    <div class="day" id="day3" style="top: 10%; left: 75%;">Day 3 — Earth</div>
    <div class="day" id="day4" style="top: 65%; left: 25%;">Day 4 — Universe</div>
    <div class="day" id="day5" style="top: 80%; left: 50%;">Day 5 — Waters & Sky</div>
    <div class="day" id="day6" style="top: 35%; left: 35%;">Day 6 — Land</div>
    <div class="day" id="day7" style="top: 55%; left: 80%;">Day 7 — Rest</div>

    <!-- Skip button -->
    <div id="skip" class="skip-btn">Skip</div>

    <!-- Message overlay -->
    <div id="message-overlay">You cannot skip creation.</div>

    <script>
        const days = [
            document.getElementById('day1'),
            document.getElementById('day2'),
            document.getElementById('day3'),
            document.getElementById('day4'),
            document.getElementById('day5'),
            document.getElementById('day6'),
            document.getElementById('day7')
        ];

        // Initially show only Day 1
        days[0].classList.add('visible');

        // Hover-to-reveal next day
        days.forEach((day, i) => {
            day.addEventListener('mouseenter', () => {
                if (i + 1 < days.length) {
                    days[i + 1].classList.add('visible');
                }
            });
        });

        // Day click redirects
        days[0].addEventListener('click', () => location.href = 'illumination.html');
        days[1].addEventListener('click', () => location.href = 'heaven.html');
        days[2].addEventListener('click', () => location.href = 'earth.html');
        days[3].addEventListener('click', () => location.href = 'universe.html');
        days[4].addEventListener('click', () => location.href = 'waters-sky.html');
        days[5].addEventListener('click', () => location.href = 'land.html');
        days[6].addEventListener('click', () => location.href = 'rest.html');

        // Skip button
        const skipBtn = document.getElementById('skip');
        const overlay = document.getElementById('message-overlay');

        skipBtn.addEventListener('click', () => {
            overlay.style.opacity = 1;
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3000);
        });
    </script>
</body>
</html>
